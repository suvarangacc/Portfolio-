<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html {
            scroll-behavior: smooth;
        }

        body {
            background-image: url('https://picsum.photos/1920/1080'); 
            background-size: cover; 
            background-position: center; 
            background-repeat: no-repeat; 
            background-attachment: fixed; 
            margin: 0;
            padding: 0;
        }

        .navbar {
            position: fixed;     
            top: 0;              
            left: 0;             
            width: 100%;         
            z-index: 1000;       
            
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.8); 
            padding: 15px 30px;
            box-sizing: border-box;
        }

        .nav-links {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
            gap: 20px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-family: Arial, sans-serif;
        }

        .profile-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh; 
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
            font-family: Arial, sans-serif;
        }

        .profile-pic {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid white;
        }

        /* --- STYLING PARA SA SOCIAL LINKS --- */
        .social-links {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }

        .social-links a {
            color: white;
            font-size: 2rem;
            transition: transform 0.3s ease, color 0.3s ease;
            text-decoration: none;
        }

        /* Hover effects para sa bawat icon */
        .social-links a:hover {
            transform: scale(1.2);
        }

        .social-links .fa-facebook:hover {
            color: #1877F2;
        }

        .social-links .fa-instagram:hover {
            color: #E1306C;
        }

        .social-links .fa-github:hover {
            color: #afb0b1;
        }
        /* ------------------------------------ */

        .section {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 2rem;
            background-color: rgba(0, 0, 0, 0.5); 
            border-bottom: 2px solid #fff;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">My Portfolio</div>
        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#quiz">Quiz</a></li>
            <li><a href="#laboratory">Laboratory</a></li>
            <li><a href="#exam">Exam</a></li>
        </ul>
    </nav>

    <section id="home" class="profile-container">
        <img src="meyan.png" alt="Profile Picture" class="profile-pic">
        <h1 class="profile-text">Hi I'm Mark Anthony Odang!</h1>
        
        <div class="social-links">
            <a href="https://www.facebook.com/markanthony.odang.18" target="_blank" title="Facebook"><i class="fab fa-facebook"></i></a>
            <a href="https://www.instagram.com/_htpps.emey?igsh=MTdlZDlrcHVqbmVncQ==" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="https://github.com/suvarangacc/kanibalismo-h" target="_blank" title="GitHub"><i class="fab fa-github"></i></a>
        </div>
    </section>

    <section id="quiz" class="section">
        <h2>Quiz</h2>
        <img src="quiz1.jpg" alt="quiz 1" class="quiz-image">
        <img src="quiz2.jpg" alt="quiz 2" class="quiz-image">
        <img src="quiz3.jpg" alt="quiz 3" class="quiz-image">
    </section>

    <section id="laboratory" class="section">
        <h2>Laboratory</h2>
        <img src="lab1.jpg" alt="Description of the picture" class="quiz-image">
    </section>

    <section id="exam" class="section">
        <h2>Exam Section</h2>
        <img src="exam 1.jpg" alt="1st Semester" class="quiz-image">
    </section>

</body>
</html>
